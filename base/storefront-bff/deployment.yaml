apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-bff
  labels:
    app: storefront-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront-bff
  template:
    metadata:
      labels:
        app: storefront-bff
    spec:
      serviceAccountName: storefront-bff
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: storefront-bff
          image: bingsu1103/storefront-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
