apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: product-retry
spec:
  hosts:
    - product.staging.svc.cluster.local
  http:
    - route:
        - destination:
            host: product.staging.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,retriable-4xx
      timeout: 10s
---
