apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
- ../../base
- ../../base/kafka-connect
- patches/kafka-connect-connector.yaml
labels:
- includeSelectors: true
  pairs:
    environment: staging
patches:
- path: patches/virtualservice-hosts.yaml
  target:
    kind: VirtualService
    name: yas-ingress-vs
- path: patches/auth.yaml
- path: patches/rolling-update-one-node.yaml
  target:
    kind: Deployment
- path: patches/storefront-ui.yaml
  target:
    kind: Deployment
    name: storefront-ui
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: .*
images:
- name: bingsu1103/backoffice
  newTag: latest
- name: bingsu1103/backoffice-bff
  newTag: latest
- name: bingsu1103/cart
  newTag: 4b1e16d9
- name: bingsu1103/customer
  newTag: latest
- name: bingsu1103/inventory
  newTag: latest
- name: bingsu1103/media
  newTag: latest
- name: bingsu1103/order
  newTag: 2861a75b
- name: bingsu1103/payment
  newTag: latest
- name: bingsu1103/product
  newTag: latest
- name: bingsu1103/sampledata
  newTag: latest
- name: bingsu1103/search
  newTag: latest
- name: bingsu1103/storefront
  newTag: latest
- name: bingsu1103/storefront-bff
  newTag: latest
- name: bingsu1103/tax
  newTag: latest
