apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- namespace.yaml
- ../../base
- ../../base/location
- ../../base/kafka-connect
- patches/kafka-connect-connector.yaml
- istio/mtls.yaml
- istio/retry.yaml
- istio/authorization.yaml
labels:
- includeSelectors: true
  pairs:
    environment: dev
patches:
- path: patches/virtualservice-hosts.yaml
- path: patches/auth.yaml
- path: patches/rolling-update-one-node.yaml
  target:
    kind: Deployment
- path: patches/storefront-ui.yaml
  target:
    kind: Deployment
    name: storefront-ui
- path: patches/swagger-ui.yaml
  target:
    kind: Deployment
    name: swagger-ui
images:
- name: bingsu1103/backoffice
  newTag: 1b6708b6
