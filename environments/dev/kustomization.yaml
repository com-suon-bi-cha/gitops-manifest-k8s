  newTag: 1b6708b6
- name: bingsu1103/inventory
  newTag: 1b6708b6
- name: bingsu1103/location
  newTag: 1b6708b6
- name: bingsu1103/media
  newTag: 1b6708b6
- name: bingsu1103/order
  newTag: 1b6708b6
- name: bingsu1103/payment
  newTag: 1b6708b6
