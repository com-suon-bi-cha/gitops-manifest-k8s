apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-to-storefront-ui
spec:
  selector:
    matchLabels:
      app: storefront-ui
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - dev
              - istio-system
