apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
spec:
  template:
    spec:
      containers:
        - name: swagger-ui
          env:
            - name: BASE_URL
              value: /swagger-ui
            - name: URLS
              value: "[{ url: '/product/v3/api-docs', name: 'Product' }, { url: '/api/media/v3/api-docs', name: 'Media' }, { url: '/customer/v3/api-docs', name: 'Customer' }, { url: '/cart/v3/api-docs', name: 'Cart' }, { url: '/order/v3/api-docs', name: 'Order' }, { url: '/payment/v3/api-docs', name: 'Payment' }, { url: '/inventory/v3/api-docs', name: 'Inventory' }, { url: '/tax/v3/api-docs', name: 'Tax' }, { url: '/search/v3/api-docs', name: 'Search' }]"
