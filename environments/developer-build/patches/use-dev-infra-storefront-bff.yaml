apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-bff
spec:
  template:
    spec:
      containers:
        - name: storefront-bff
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-master.dev.svc.cluster.local"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI
              value: "http://35.247.165.74:31096/realms/Yas"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI
              value: "http://35.247.165.74:31096/realms/Yas/protocol/openid-connect/auth"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI
              value: "http://identity.dev.svc.cluster.local/realms/Yas/protocol/openid-connect/token"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI
              value: "http://identity.dev.svc.cluster.local/realms/Yas/protocol/openid-connect/certs"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI
              value: "http://identity.dev.svc.cluster.local/realms/Yas/protocol/openid-connect/userinfo"
            - name: YAS_SERVICES_TOKEN_IDENTITY
              value: "http://identity.dev.svc.cluster.local/realms/Yas/protocol/openid-connect/token"
