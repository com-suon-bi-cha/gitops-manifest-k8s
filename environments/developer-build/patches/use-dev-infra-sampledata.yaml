apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampledata
spec:
  template:
    spec:
      containers:
        - name: sampledata
          env:
            - name: SPRING_DATASOURCE_PRODUCT_URL
              value: "jdbc:postgresql://postgres-postgresql.dev.svc.cluster.local:5432/product"
            - name: SPRING_DATASOURCE_MEDIA_URL
              value: "jdbc:postgresql://postgres-postgresql.dev.svc.cluster.local:5432/media"
