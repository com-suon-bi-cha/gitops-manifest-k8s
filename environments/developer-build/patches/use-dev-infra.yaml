apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  template:
    spec:
      containers:
        - name: media
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-postgresql.dev.svc.cluster.local:5432/media?sslmode=disable"
---
