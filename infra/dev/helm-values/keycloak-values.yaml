auth:
  adminPassword: admin
  adminUser: admin
externalDatabase:
  database: keycloak
  host: postgres-postgresql.dev.svc.cluster.local
  password: password
  port: 5432
  user: postgres
extraEnvVars:
  - name: KC_DB_URL_PROPERTIES
    value: ?sslmode=disable
image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0
postgresql:
  enabled: false
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi
